# Bunny Linux live USB boot menu.
set timeout=5
set default=0

menuentry "Install Bunny Linux" {
    linux /boot/vmlinuz root=live:CDLABEL=BUNNY rd.live.image rd.live.overlay.overlayfs=1 quiet
    initrd /boot/initramfs.img
}

menuentry "Bunny Linux live USB (terminal)" {
    linux /boot/vmlinuz root=live:CDLABEL=BUNNY rd.live.image rd.live.overlay.overlayfs=1 quiet bunny.terminal
    initrd /boot/initramfs.img
}

menuentry "Bunny Linux live USB (show start-up messages)" {
    linux /boot/vmlinuz root=live:CDLABEL=BUNNY rd.live.image rd.live.overlay.overlayfs=1
    initrd /boot/initramfs.img
}

menuentry "Bunny Linux live USB (load everything into memory, then the USB can be removed)" {
    linux /boot/vmlinuz root=live:CDLABEL=BUNNY rd.live.image rd.live.overlay.overlayfs=1 rd.live.ram=1 quiet
    initrd /boot/initramfs.img
}

menuentry "Restart into the computer's firmware settings" {
    fwsetup
}
