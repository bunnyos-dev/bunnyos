name: Probe tmux and chrony (temporary)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: In a fresh Gentoo
        run: |
          docker create -v /var/db/repos/gentoo --name portage gentoo/portage:latest /bin/true
          docker run --rm --volumes-from portage gentoo/stage3:latest sh -c '
            for e in /var/db/repos/gentoo/app-misc/tmux/*.ebuild; do echo "-- $e"; grep -E "^KEYWORDS|IUSE" "$e"; done
            grep -A2 "vim-syntax" /var/db/repos/gentoo/app-misc/tmux/metadata.xml /var/db/repos/gentoo/profiles/use.desc
            ls /var/db/repos/gentoo/net-misc/chrony/; grep -l "chronyd" /var/db/repos/gentoo/net-misc/chrony/files/* | head
          '
