[workspace]
resolver = "2"
members = ["crates/bunny", "crates/bunny-installer"]
# A plain `cargo build` makes bunny only (static builds included). The
# graphical installer needs GUI libraries: `cargo build -p bunny-installer`.
default-members = ["crates/bunny"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/bunnyos-dev/bunnyos"
