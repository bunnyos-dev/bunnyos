name: Probe modules-load and firefox (temporary)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: In a fresh Gentoo
        run: |
          docker create -v /var/db/repos/gentoo --name portage gentoo/portage:latest /bin/true
          docker run --rm --volumes-from portage gentoo/stage3:latest sh -c '
            getuto >/dev/null 2>&1
            FEATURES="getbinpkg" emerge -q --getbinpkgonly net-wireless/iwd >/dev/null 2>&1
            echo "== openrc version"; ls /var/db/pkg/sys-apps/ | grep openrc
            for f in /etc/init.d/modules /etc/init.d/modules-load /etc/conf.d/modules /etc/conf.d/modules-load; do echo "== $f"; cat $f 2>/dev/null; done
            echo "== who asks for pkcs8"; grep -rn pkcs8 /usr/lib/modules-load.d /etc/modules-load.d /lib/modules-load.d /run/modules-load.d 2>/dev/null
            echo "== modules-load in runlevels"; ls /etc/runlevels/*/ | head -40
            echo "== firefox ebuilds"; ls /var/db/repos/gentoo/www-client/firefox/
            for e in /var/db/repos/gentoo/www-client/firefox/*.ebuild; do echo "-- $e"; grep -E "^KEYWORDS|^IUSE|^[[:space:]]+IUSE|^SLOT" "$e"; done
            echo "== stable firefox, as emerge sees it"; emerge -pv --nodeps www-client/firefox 2>&1 | tail -6
            echo "== metadata.xml"; cat /var/db/repos/gentoo/www-client/firefox/metadata.xml
            echo "== global flags"; for f in X dbus debug hardened jack libproxy pulseaudio selinux sndio test wayland wifi clang lto pgo telemetry; do grep -E "^$f - " /var/db/repos/gentoo/profiles/use.desc; done
            echo "== profile defaults"; emerge --info 2>/dev/null | grep "^USE="
            echo "== binhost has firefox?"; FEATURES=getbinpkg emerge -pv --getbinpkgonly --nodeps www-client/firefox 2>&1 | tail -8
            echo "== firefox-bin"; ls /var/db/repos/gentoo/www-client/firefox-bin/ 
            echo "== gentoolkit binary?"; FEATURES=getbinpkg emerge -pv --getbinpkgonly app-portage/gentoolkit 2>&1 | tail -4
          '
