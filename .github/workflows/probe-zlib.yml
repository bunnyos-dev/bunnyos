name: Probe quiet boot of the live USB (temporary)
on: push
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get the ISO and its kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q qemu-system-x86 xorriso >/dev/null
          gh run download 45243568679 -R "$GITHUB_REPOSITORY" -n bunny-linux-live-preview -D iso
          ls -la iso
          xorriso -osirrox on -indev iso/*.iso -extract /boot/vmlinuz vmlinuz -extract /boot/initramfs.img initramfs.img
          xorriso -osirrox on -indev iso/*.iso -extract /boot/grub/grub.cfg grub.cfg; cat grub.cfg
          sudo chmod 666 /dev/kvm || true
      - name: Boot quietly, old option
        run: |
          timeout 150 qemu-system-x86_64 -accel kvm -m 2048 -nographic -no-reboot -cdrom iso/*.iso \
            -kernel vmlinuz -initrd initramfs.img \
            -append "root=live:CDLABEL=BUNNY rd.live.image rd.live.overlay.overlayfs=1 quiet console=ttyS0" > a.log 2>&1 || true
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' a.log | cat -A | head -120
      - name: Boot quietly, rd.overlay
        run: |
          timeout 150 qemu-system-x86_64 -accel kvm -m 2048 -nographic -no-reboot -cdrom iso/*.iso \
            -kernel vmlinuz -initrd initramfs.img \
            -append "root=live:CDLABEL=BUNNY rd.live.image rd.overlay quiet console=ttyS0" > b.log 2>&1 || true
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' b.log | cat -A | head -120
      - name: Boot with rd.overlay, not quiet (does the overlay work?)
        run: |
          timeout 150 qemu-system-x86_64 -accel kvm -m 2048 -nographic -no-reboot -cdrom iso/*.iso \
            -kernel vmlinuz -initrd initramfs.img \
            -append "root=live:CDLABEL=BUNNY rd.live.image rd.overlay console=ttyS0" > c.log 2>&1 || true
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' c.log | grep -i -E "dracut|overlay|deprecated|Starting local|insmod|read-only|emergency" | head -40
