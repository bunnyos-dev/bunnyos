name: ISO

# Builds the Bunny Linux live USB image (tools/build-iso.sh) and checks that
# it starts. Pushing a tag like v0.2.0 attaches the ISO and its SHA256 to
# that GitHub Release. A change on main that touches the image replaces the
# rolling "Preview" pre-release (tag `preview`) with the new image, for
# testers. On pull requests that change the image, and when run by hand, the
# ISO is kept as a download on the run's page instead.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/iso.yml"
      - "tools/build-iso.sh"
      - "tools/iso/**"
      - "crates/**"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/iso.yml"
      - "tools/build-iso.sh"
      - "tools/iso/**"
      - "crates/bunny-installer/**"
  workflow_dispatch:

permissions:
  contents: write

# One preview at a time; a newer push to main replaces an older one in progress.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  iso:
    name: Build and check the live USB image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools squashfs-tools xorriso mtools \
            grub-common grub-efi-amd64-bin qemu-system-x86 ovmf \
            libinput-dev libudev-dev libxkbcommon-dev libfontconfig1-dev
      - name: Build bunny (static, runs on the USB)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Build the graphical installer (uses the USB's libinput, xkbcommon and fontconfig)
        run: cargo build --release --locked -p bunny-installer
      - name: Name the ISO
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "iso=bunny-linux-live-${GITHUB_REF_NAME#v}.iso" >> "$GITHUB_OUTPUT"
            echo "preview=0" >> "$GITHUB_OUTPUT"
          else
            echo "iso=bunny-linux-live-preview.iso" >> "$GITHUB_OUTPUT"
            echo "preview=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the image
        env:
          WORK: ${{ runner.temp }}/iso-work
          # Preview images record bunny install (see tools/build-iso.sh).
          PREVIEW: ${{ steps.name.outputs.preview }}
          INSTALLER: target/release/bunny-installer
        run: |
          mkdir -p dist
          sudo --preserve-env=WORK,PREVIEW,INSTALLER tools/build-iso.sh \
            target/x86_64-unknown-linux-musl/release/bunny \
            "dist/${{ steps.name.outputs.iso }}"
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -lh dist
      - name: What takes the space
        env:
          WORK: ${{ runner.temp }}/iso-work
        run: |
          sudo cat "$WORK/sizes.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that it starts
        env:
          WORK: ${{ runner.temp }}/iso-work
        run: |
          # Boots the ISO's own kernel and startup image with the console on
          # the serial port, and waits for OpenRC to start services: that
          # means the startup image found the USB and switched to it.
          accel="-accel tcg"
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          [ -w /dev/kvm ] && accel="-accel kvm"
          sudo cp "$WORK/iso/boot/vmlinuz" "$WORK/iso/boot/initramfs.img" "$RUNNER_TEMP/"
          sudo chmod a+r "$RUNNER_TEMP/vmlinuz" "$RUNNER_TEMP/initramfs.img"
          timeout 600 qemu-system-x86_64 $accel -m 2048 -nographic -no-reboot \
            -cdrom "dist/${{ steps.name.outputs.iso }}" \
            -kernel "$RUNNER_TEMP/vmlinuz" -initrd "$RUNNER_TEMP/initramfs.img" \
            -append "root=live:CDLABEL=BUNNY rd.live.image rd.live.overlay.overlayfs=1 console=ttyS0" \
            > boot.log 2>&1 &
          qemu=$!
          for _ in $(seq 1 120); do
            # "Starting local" is the last service of the default runlevel.
            if grep -qE "Starting (local|DHCP Client Daemon)" boot.log; then
              echo "✓ The live system started (OpenRC is starting services)."
              if [ "${{ steps.name.outputs.preview }}" = 1 ]; then
                sudo test -f "$WORK/root/etc/bunny-preview.toml" \
                  || { echo "✗ A preview image without /etc/bunny-preview.toml"; exit 1; }
              fi
              kill "$qemu" 2>/dev/null || true
              exit 0
            fi
            if grep -qiE "dracut Warning: (Could not boot|Unable to process)|Kernel panic|emergency shell" boot.log; then
              break
            fi
            sleep 5
          done
          kill "$qemu" 2>/dev/null || true
          echo "✗ The live system didn't start. The last of its messages:"
          tail -60 boot.log
          exit 1
      - name: Keep the boot messages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-boot-log
          path: boot.log
          if-no-files-found: ignore
      - name: Keep the ISO (when not releasing)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bunny-linux-live-preview
          path: dist/
          retention-days: 7
      - name: Publish the preview (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: ${{ steps.name.outputs.iso }}
        run: |
          cat > preview-notes.md <<EOF
          **Pre-alpha preview: for testing, not for everyday use yet.**

          The newest live USB image, rebuilt from \`main\` ($(git rev-parse --short HEAD), $(date -u +%Y-%m-%d)) whenever a change touches it. It replaces the previous preview.

          - Try it in a virtual machine first: [Testing Bunny Linux in a virtual machine](https://bunnyos-dev.github.io/bunnyos/reference/testing-in-a-vm.html).
          - Installing: [Install Bunny Linux](https://bunnyos-dev.github.io/bunnyos/start/installing.html).
          - Preview images turn on developer mode in the system they install: bunny keeps a recording of its own commands on that computer, and sends nothing unless you run \`bunny report\`. See [Developer mode](https://bunnyos-dev.github.io/bunnyos/reference/developer-mode.html).
          - Check the download: \`sha256sum -c ${ISO}.sha256\`

          What's changed since the last release: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md), under Unreleased.
          EOF
          # Delete and make again, so the tag moves to this commit.
          gh release delete preview --cleanup-tag --yes 2>/dev/null || true
          gh release create preview --prerelease --target "$GITHUB_SHA" \
            --title "Preview (pre-alpha), $(date -u +%Y-%m-%d)" \
            --notes-file preview-notes.md \
            "dist/$ISO" "dist/$ISO.sha256"
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml creates the release; wait for it if it isn't there yet.
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "dist/${{ steps.name.outputs.iso }}" \
            "dist/${{ steps.name.outputs.iso }}.sha256"
