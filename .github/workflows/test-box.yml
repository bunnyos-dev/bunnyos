# Runs on the home test machine (a self-hosted runner labelled bunny-hw).
#
# Safety: this repository is public, so jobs for the test machine are only
# started by hand (workflow_dispatch) or on a schedule, never by pull
# requests, which anyone can open. Don't add `pull_request` triggers to any
# workflow that uses `bunny-hw`.
name: Test machine

on:
  workflow_dispatch:
  schedule:
    # Every night at 9:17 UTC: 4:17 AM in Toronto in winter, 5:17 AM in summer.
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly check (changes nothing)
    runs-on: [self-hosted, bunny-hw]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Health of the machine
        run: sh tools/test-box/nightly-check.sh

      - name: Config matches the system
        # `bunny diff` exits 1 when the system has drifted from bunny.toml.
        run: bunny diff

      - name: bunny status
        # Warns (yellow) when anything needs a look, such as a package list
        # older than a week or a security advisory. Those are worth knowing
        # about but aren't breakage, so they don't turn the run red or send
        # failure emails.
        run: |
          bunny status --check || echo "::warning title=bunny status::Something needs a look; the lines marked ⚠ or ✗ above say what."
